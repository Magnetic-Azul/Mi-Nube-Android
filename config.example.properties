# Plantilla de configuración. NO pongas aquí datos reales.
# Copia estas claves a tu gradle.properties de usuario (%USERPROFILE%\.gradle\gradle.properties),
# que está fuera del repositorio, o a local.properties (ignorado por git).
# En GitHub Actions llegan como variables de entorno con el mismo nombre.

# Dirección del servidor dentro de Tailscale (siempre https y el nombre .ts.net, no la IP).
MINUBE_SERVER_URL=https://servidor.tuTailnet.ts.net

# Repositorio público donde se publican las versiones (usuario/repo). En CI se rellena solo.
MINUBE_GITHUB_REPO=usuario/repo

# Solo para compilar la versión de release en tu PC (en CI vienen de los Secrets):
# MINUBE_KEYSTORE_FILE=C:/Users/tu-usuario/MiNube-firma/minube-release.jks
# MINUBE_KEYSTORE_PASSWORD=...
# MINUBE_KEY_ALIAS=minube
# MINUBE_KEY_PASSWORD=...
