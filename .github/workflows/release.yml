name: Publicar APK

# Se ejecuta al subir una etiqueta vX.Y.Z:  git tag -a v1.0.1 -m "Qué cambia" ; git push origin v1.0.1
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # crear la release y subir el APK

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Entorno con aprobación manual: Settings → Environments → release → Required reviewers (tú).
    # Mueve allí los secrets de la keystore para que ningún otro workflow pueda usarlos.
    environment: release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Comprobar configuración
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          [ -n "$SERVER_URL" ] || { echo "::error::Falta la variable del repositorio SERVER_URL (Settings → Variables)"; exit 1; }
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Falta el secret KEYSTORE_BASE64 (Settings → Secrets)"; exit 1; }

      - name: Preparar keystore (fuera del espacio de trabajo)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/minube-release.jks"

      - name: Versión y notas
        id: v
        run: |
          TAG="$GITHUB_REF_NAME"
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          NOTAS="$(git tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN/,$d')"
          [ -n "$NOTAS" ] || NOTAS="Mejoras y correcciones."
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          { echo "notas<<FIN_NOTAS"; echo "$NOTAS"; echo "FIN_NOTAS"; } >> "$GITHUB_OUTPUT"

      - name: Compilar APK firmado
        env:
          MINUBE_SERVER_URL: ${{ vars.SERVER_URL }}
          MINUBE_GITHUB_REPO: ${{ github.repository }}
          MINUBE_VERSION_CODE: ${{ github.run_number }}
          MINUBE_VERSION_NAME: ${{ steps.v.outputs.version }}
          MINUBE_KEYSTORE_FILE: ${{ runner.temp }}/minube-release.jks
          MINUBE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MINUBE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MINUBE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verificar firma y generar latest.json
        env:
          VERSION: ${{ steps.v.outputs.version }}
          NOTAS: ${{ steps.v.outputs.notas }}
          REPO: ${{ github.repository }}
          CODE: ${{ github.run_number }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$APK"
          OUT="MiNube-$VERSION.apk"
          cp "$APK" "$OUT"
          SHA="$(sha256sum "$OUT" | cut -d' ' -f1)"
          jq -n --argjson code "$CODE" --arg name "$VERSION" --arg sha "$SHA" --arg notas "$NOTAS" \
                --arg url "https://github.com/$REPO/releases/download/$GITHUB_REF_NAME/$OUT" \
                '{versionCode:$code, versionName:$name, apkUrl:$url, sha256:$sha, notas:$notas}' > latest.json
          cat latest.json
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTAS: ${{ steps.v.outputs.notas }}
          VERSION: ${{ steps.v.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" "$APK" latest.json --title "Mi Nube $VERSION" --notes "$NOTAS" --latest

      - name: Borrar keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/minube-release.jks"
